baseURL = 'https://profi-web-de.github.io/carlos-johnson/'
theme = 'PaperMod'
# Multilingüe: alemán por defecto (sirve en la raíz), español e inglés en subcarpeta.
# Esta clave DEBE ir antes de cualquier [tabla]: dentro de una, TOML la trata como
# clave de esa tabla y Hugo la ignora, cayendo silenciosamente a 'en'.
defaultContentLanguage = 'de'
# canonifyURLs = false
buildFuture = true

# Las secciones de la portada (content/home/*) son fragmentos de contenido, no
# páginas: existen para que el CMS pueda editarlas por separado, y el layout de
# la home las lee con site.GetPage. El cascade vive aquí y no en el front matter
# para que el CMS no pueda borrarlo al guardar.
[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'never'
  [cascade.target]
    path = '{/home,/home/**}'

[services]
  [services.googleAnalytics]
    id = 'G-FHH7XVEBFG'

[languages]
  [languages.de]
    languageCode = 'de-DE'
    languageName = 'Deutsch'
    weight = 1
    title = 'Carlos Johnson'
    [languages.de.params]
      description = 'Klassischer Geiger und Dozent'

  [languages.es]
    languageCode = 'es-ES'
    languageName = 'Español'
    weight = 2
    title = 'Carlos Johnson'
    [languages.es.params]
      description = 'Violinista Clásico y Profesor'

  [languages.en]
    languageCode = 'en-GB'
    languageName = 'English'
    weight = 3
    title = 'Carlos Johnson'
    [languages.en.params]
      description = 'Classical Violinist, Conductor and Teacher'

[params]
  # 'auto' respeta la preferencia del sistema; el interruptor de la cabecera la
  # sobrescribe y la elección queda guardada en localStorage.
  defaultTheme = 'auto'
  ShowShareButtons = false
  ShowReadingTime = false
  # Imagen por defecto al compartir el sitio (WhatsApp, Facebook, LinkedIn...)
  images = ['og-default.jpg']
  author = 'Carlos Johnson'
  [params.assets]
    favicon = 'favicon.svg'
    theme_color = '#8a2b34'
    msapplication_TileColor = '#8a2b34'
  # Titular del copyright del pie. Si se omite, se usa el title del sitio.
  copyright_name = 'Carlos Johnson'
  [params.profileMode]
    enabled = true
  # Credito del desarrollador en el pie. Borra este bloque para ocultarlo.
  [params.developer]
    name = 'Pablo Johnson'
    url = 'https://github.com/pablo-johnson'
  [params.seo]
    same_as = ["https://www.instagram.com/carlosjohnsonviolinista/", "https://www.youtube.com/@carlosjohnson5907", "https://www.facebook.com/carlos.johnson.violinista"]
    job_title = 'Violinista Clásico y Director de Orquesta'
    genre     = 'Klassische Musik'

